format: 1
id: FR:school
language: cel
title: Schools in France

inputs:
  id: the establishment's UAI
  name: the establishment's name as its register writes it
  kind: "the kind of establishment in words: Ecole, Collège, Lycée, Médico-social, Service Administratif…"
  nature_code: the ministry's three-digit nature code
  nature_label: the ministry's label for the nature code, in words
  has_maternelle: yes/no, teaches the maternelle years
  has_elementaire: yes/no, teaches the élémentaire years
  status: public or private, in words
  siret: the 14-digit SIRET, spaces allowed
  phone: the phone number as written
  website: the website as written
  email: the mailbox
  opening_date: the date the establishment opened, YYYY-MM-DD
  state: open or closed, in words
  attachment_type: "how the establishment is attached to its parent establishment, in words: a section, a geographic annex…"
  parent_id: the UAI of its parent establishment
  location_precision: how precisely the register places the point, in words
  street: the address line holding the housenumber and street
  address_line_2: the next address line, where a CEDEX or a postal box may be written
  address_line_3: the line after it
  postcode: the postcode
  city: the commune's name
  lat: latitude, WGS84
  lon: longitude, WGS84

record:
  key: id
  lat: lat
  lon: lon
  skip: >-
    !(postbac || medico) && (kind == "" ||
    kind.imatches("^(service administratif|information et orientation)$") || nature_code == "809")
  closed: 'state.imatches("^ferm")'
  addr: 'street != "" && place != "" ? street + ", " + place : street + place'
  address: 'fr_school_streetQuery(street, address_line_2 + " " + address_line_3, postcode, city)'
  # A school's grounds can stretch a few hundred metres from its gate.
  farM: 1000
  pick: nearest
  tieBreak: name
  withheld: [phone, email]
  skipBy:
    function: fr.school/housed
    reads: [attachment_type, nature_code, parent_id, street, postcode]
  sitesBy:
    function: fr.school/sites
    reads: [phone, website, street, postcode, lat, lon]

let:
  postbac: 'nature_code == "400"'
  medico: 'kind.imatches("^m[ée]dico")'
  ecole: 'kind.imatches("^[ée]cole")'
  mat: 'truthy(has_maternelle)'
  elem: 'truthy(has_elementaire)'
  level: >-
    postbac || medico ? ""
    : ecole ? (mat && elem ? "primaire" : mat ? "maternelle" : elem ? "élémentaire" : "")
    : kind.imatches("^coll[èe]ge") ? "collège"
    : kind.imatches("^lyc[ée]e") ? "lycée" : ""
  place: 'postcode != "" && city != "" ? postcode + " " + city : postcode + city'
  siret14: 'siret.remove(r"\s")'
  said: 'status.imatches("^public") ? "public" : status.imatches("priv") ? "private" : ""'
  bySiren: >-
    !siret14.matches(r"^\d{14}$") ? "" : siret14.matches("^[12]") ? "public" : "private"
  phoneFr: 'phone(phone, "33")'

tags:
  amenity:
    value: 'postbac ? "college" : medico ? "social_facility" : "school"'
    conf: 0.9
    fill: 'medico && !postbac'
    quote: [nature_label]
    kind: derived
    rule: >-
      Every level from the maternelle up is a school in France; post-bac only is a college.
      A medico-social institute is a social facility, and never changes the main tag of one
      already mapped.
  social_facility:for:
    value: 'medico && !postbac ? "disabled" : ""'
    conf: 0.8
    fill: true
    quote: [nature_label]
    kind: derived
  school:FR:
    value: level
    conf: 0.9
    quote: [kind, has_maternelle, has_elementaire]
    kind: derived
  name: { function: fr.school/name, reads: [name], conf: 0.9, fill: true }
  ref:UAI:
    value: id
    conf: 0.98
    ref: true
  ref:FR:SIRET:
    value: 'siret14.matches(r"^\d{14}$") ? siret14 : ""'
    conf: 0.95
    ref: true
  phone:
    value: 'mobile(phoneFr) ? "" : phoneFr'
    conf: 0.85
    rule: Written as FR:Key:phone does. A mobile is left out.
    kind: normalised
  website:
    value: 'website(website)'
    conf: 0.8
  email: { function: fr.school/mailbox, reads: [email, name, city, street], quote: [email], conf: 0.8, fill: true }
  start_date:
    value: 'opening_date.matches(r"^\d{4}-\d{2}-\d{2}$") ? opening_date : ""'
    conf: 0.7
    fill: true
    rule: The opening date, when it is a full date.
    quote: [opening_date]
  operator:type:
    value: 'said != "" && (bySiren == "" || bySiren == said) ? said : ""'
    conf: 0.9
    rule: From the stated status, unless the SIRET's first digit says otherwise.
    quote: [status]
  # One function answers all four; each tag takes its own key and states its own confidence.
  addr:housenumber: { function: fr.school/address, reads: [street, address_line_2, address_line_3, postcode, city], quote: [street], conf: 0.8, fill: true, group: addr }
  addr:street: { function: fr.school/address, reads: [street, address_line_2, address_line_3, postcode, city], quote: [street], conf: 0.8, fill: true, group: addr }
  addr:postcode: { function: fr.school/address, reads: [street, address_line_2, address_line_3, postcode, city], quote: [postcode], conf: 0.85, fill: true, group: addr }
  addr:city: { function: fr.school/address, reads: [street, address_line_2, address_line_3, postcode, city], quote: [city], conf: 0.85, fill: true, group: addr }

notes:
  - when: 'location_precision != "" && !location_precision.imatches("^(parfaite|num[ée]ro de rue)$")'
    text: "The directory places it only to the precision of: {location_precision}"

examples:
  - about: a primaire, public, with a landline
    rows:
      - { id: 0690001A, kind: Ecole, nature_code: "151", has_maternelle: "1", has_elementaire: "1", status: Public, siret: "216 901 231 00012", phone: "0478123456", website: ecole-exemple.fr, opening_date: "1965-09-01" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690001A, ref:FR:SIRET: "21690123100012", phone: "+33 4 78 12 34 56", website: "https://ecole-exemple.fr", operator:type: public, start_date: "1965-09-01" }
  - about: a collège, mobile number left out, private by status but a public SIRET
    rows:
      - { id: 0690002B, kind: Collège, nature_code: "340", status: Privé, siret: "19690002000015", phone: "06 12 34 56 78", opening_date: "1992-09-01" }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690002B, ref:FR:SIRET: "19690002000015", start_date: "1992-09-01" }
  - about: a medico-social institute
    rows:
      - { id: 0690003C, kind: Médico-social, nature_code: "999" }
    expect: { amenity: social_facility, social_facility:for: disabled, ref:UAI: 0690003C }
  - about: an administrative office is not a place
    rows:
      - { id: 0690004D, kind: Service Administratif, nature_code: "809" }
    expect: null
  - about: no type at all is not a place
    rows:
      - { id: 0690005E, nature_code: "151" }
    expect: null
  - about: the name quieted from capitals, a role mailbox kept, a CEDEX postcode dropped from the address
    rows:
      - { id: 0690006F, name: "COLLEGE JEAN MOULIN", kind: Collège, nature_code: "340", email: "secretariat@college-moulin.fr", street: "12  bd PINEL", address_line_3: "69321 LYON CEDEX 07", postcode: "69321", city: "Lyon 3e  Arrondissement" }
    expect: { amenity: school, school:FR: collège, name: Collège Jean Moulin, ref:UAI: 0690006F, email: "secretariat@college-moulin.fr", addr:housenumber: "12", addr:street: Boulevard PINEL, addr:city: Lyon }
  - about: a person's mailbox, and an address that is not a street, are left out
    rows:
      - { id: 0690007G, name: Ecole Les Prés, kind: Ecole, nature_code: "151", has_elementaire: "1", email: "audrey.lagane@lespetitesfamilles.fr", street: "Lieu-dit Les Prés", postcode: "69100", city: Villeurbanne }
    expect: { amenity: school, school:FR: élémentaire, name: École Les Prés, ref:UAI: 0690007G }
  - about: a phone at an overseas mobile prefix is a mobile too
    rows:
      - { id: 9740001A, kind: Collège, nature_code: "340", phone: "0692 12 34 56" }
    expect: { amenity: school, school:FR: collège, ref:UAI: 9740001A }
  - about: a point the directory places only to the street
    rows:
      - { id: 0690008H, kind: Collège, nature_code: "340", location_precision: Rue }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690008H }
    notes: ["The directory places it only to the precision of: Rue"]
  - about: a point placed at the housenumber needs no line
    rows:
      - { id: 0690009J, kind: Collège, nature_code: "340", location_precision: Parfaite }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690009J }
  - about: a maternelle
    rows:
      - { id: 0690044K, kind: Ecole, has_maternelle: "1", has_elementaire: "0" }
    expect: { amenity: school, school:FR: maternelle, ref:UAI: 0690044K }
  - about: an élémentaire
    rows:
      - { id: 0690045K, kind: Ecole, has_maternelle: "0", has_elementaire: "1" }
    expect: { amenity: school, school:FR: "élémentaire", ref:UAI: 0690045K }
  - about: a lycée
    rows:
      - { id: 0690046K, kind: "Lycée", has_maternelle: "1", has_elementaire: "1" }
    expect: { amenity: school, school:FR: "lycée", ref:UAI: 0690046K }
  - about: a post-bac establishment is a college with no school:FR
    rows:
      - { id: 0690047K, kind: "", has_maternelle: "1", has_elementaire: "1", nature_code: "400" }
    expect: { amenity: college, ref:UAI: 0690047K }
  - about: an école of nature 809 is an office, not a school
    rows:
      - { id: 0690048K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", nature_code: "809" }
    expect: null
  - about: the name's accent restored
    rows:
      - { id: 0690049K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", name: "Ecole Jean Jaurès" }
    expect: { amenity: school, school:FR: primaire, name: "École Jean Jaurès", ref:UAI: 0690049K }
  - about: an académie's mailbox is kept
    rows:
      - { id: 0690050K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", email: "ce.0690001A@ac-lyon.fr" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690050K, email: "ce.0690001A@ac-lyon.fr" }
  - about: a private status against a public SIRET proposes no operator:type
    rows:
      - { id: 0690051K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", status: "Privé", siret: "26690008300012" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690051K, ref:FR:SIRET: "26690008300012" }
  - about: a public status against a private SIRET proposes none
    rows:
      - { id: 0690052K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", status: Public, siret: "77564661500564" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690052K, ref:FR:SIRET: "77564661500564" }
  - about: a private status over a private SIRET is private
    rows:
      - { id: 0690053K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", status: "Privé", siret: "77564661500564" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690053K, ref:FR:SIRET: "77564661500564", operator:type: private }
  - about: a private status with no SIRET is private
    rows:
      - { id: 0690054K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", status: "Privé", siret: "" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690054K, operator:type: private }
  - about: a webmail mailbox naming the school
    rows:
      - { id: 0690055K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", name: "Ecole professionnelle privée Atelier d'Apprentissage de Gorge de Loup", street: "105  AVENUE SIDOINE APOLLINAIRE", postcode: "69003", city: "Lyon 9e  Arrondissement", email: "gorge.de.loup@wanadoo.fr" }
    expect: { amenity: school, school:FR: primaire, name: "École professionnelle privée Atelier d'Apprentissage de Gorge de Loup", ref:UAI: 0690055K, email: "gorge.de.loup@wanadoo.fr", addr:housenumber: "105", addr:street: "AVENUE SIDOINE APOLLINAIRE", addr:postcode: "69003", addr:city: Lyon }
  - about: a webmail mailbox naming the school, spelt with dots
    rows:
      - { id: 0690056K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", name: "Collège de l'école Juive de Lyon", street: "40 rue Alexandre Boutin", postcode: "69003", city: Villeurbanne, email: "ecole.juive.de.lyon@wanadoo.fr" }
    expect: { amenity: school, school:FR: primaire, name: "Collège de l'école Juive de Lyon", ref:UAI: 0690056K, email: "ecole.juive.de.lyon@wanadoo.fr", addr:housenumber: "40", addr:street: "Rue Alexandre Boutin", addr:postcode: "69003", addr:city: Villeurbanne }
  - about: a webmail mailbox naming a person
    rows:
      - { id: 0690057K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", name: "Ecole secondaire privée La Fourmi", street: "16 rue JEAN DESPARMET", postcode: "69003", city: "Lyon 8e  Arrondissement", email: "sophiejery@gmail.com" }
    expect: { amenity: school, school:FR: primaire, name: "École secondaire privée La Fourmi", ref:UAI: 0690057K, addr:housenumber: "16", addr:street: "Rue JEAN DESPARMET", addr:postcode: "69003", addr:city: Lyon }
  - about: a webmail mailbox naming nothing of the school
    rows:
      - { id: 0690058K, kind: Ecole, has_maternelle: "1", has_elementaire: "1", name: "Ecole élémentaire privée des Savoirs Partagés", postcode: "69003", city: Lyon, street: "2 rue Jaurès", email: "fatemi60@orange.fr" }
    expect: { amenity: school, school:FR: primaire, name: "École élémentaire privée des Savoirs Partagés", ref:UAI: 0690058K, addr:housenumber: "2", addr:street: "Rue Jaurès", addr:postcode: "69003", addr:city: Lyon }
