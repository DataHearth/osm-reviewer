overrides:
  tags:
    start_date:
      value: >-
        opening_date.matches(r"^\d{4}-\d{2}-\d{2}$") && opening_date >= "1978" && level != "primaire"
        ? opening_date : ""
      rule: >-
        Only from 1978 on (earlier dates are this register's bulk entries) and never for a primaire
        (the date is a merger's).

examples:
  - about: the same primaire as the mapping's first example, through the Annuaire's own columns; the override drops its date
    rows:
      - { identifiant_de_l_etablissement: 0690001A, type_etablissement: Ecole, code_nature: "151", ecole_maternelle: "1", ecole_elementaire: "1", statut_public_prive: Public, siren_siret: "216 901 231 00012", telephone: "0478123456", web: ecole-exemple.fr, date_ouverture: "1965-09-01" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690001A, ref:FR:SIRET: "21690123100012", phone: "+33 4 78 12 34 56", website: "https://ecole-exemple.fr", operator:type: public }
  - about: a collège opened in 1992 keeps its date
    rows:
      - { identifiant_de_l_etablissement: 0690002B, type_etablissement: Collège, code_nature: "340", statut_public_prive: Public, date_ouverture: "1992-09-01" }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690002B, operator:type: public, start_date: "1992-09-01" }
  - about: a register date before 1978 is a bulk entry, and a primaire's is a merger's
    rows:
      - { identifiant_de_l_etablissement: 0690003C, type_etablissement: Ecole, code_nature: "152", ecole_maternelle: "0", ecole_elementaire: "1", date_ouverture: "1977-03-08" }
    expect: { amenity: school, school:FR: élémentaire, ref:UAI: 0690003C }
  - about: a maternelle opened in 2023 keeps its date
    rows:
      - { identifiant_de_l_etablissement: 0690004D, type_etablissement: Ecole, code_nature: "151", ecole_maternelle: "1", ecole_elementaire: "0", date_ouverture: "2023-09-01" }
    expect: { amenity: school, school:FR: maternelle, ref:UAI: 0690004D, start_date: "2023-09-01" }
  - about: a primaire opened after 1978 gets no date, since it is a merger's
    rows:
      - { identifiant_de_l_etablissement: 0690005E, type_etablissement: Ecole, code_nature: "151", ecole_maternelle: "1", ecole_elementaire: "1", date_ouverture: "2017-09-01" }
    expect: { amenity: school, school:FR: primaire, ref:UAI: 0690005E }
  - about: an empty date gives none
    rows:
      - { identifiant_de_l_etablissement: 0690006F, type_etablissement: Collège, code_nature: "340", date_ouverture: "" }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690006F }
  - about: a date not written as year-month-day gives none
    rows:
      - { identifiant_de_l_etablissement: 0690007G, type_etablissement: Collège, code_nature: "340", date_ouverture: "09/1992" }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690007G }
  - about: an older export's spellings are read where the current columns are empty
    rows:
      - { identifiant_de_l_etablissement: 0690008H, type_etablissement: Collège, code_nature: "340", statut_public_prive: Public, siren_siret: "", numero_siren_siret: "19690008000011", web: "", site_web: ecole-exemple.fr }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690008H, ref:FR:SIRET: "19690008000011", website: "https://ecole-exemple.fr", operator:type: public }
  - about: the current columns win over an older export's spellings where both hold a value
    rows:
      - { identifiant_de_l_etablissement: 0690009J, type_etablissement: Collège, code_nature: "340", statut_public_prive: Public, siren_siret: "19690009000012", numero_siren_siret: "19690008000011", web: exemple.org, site_web: ecole-exemple.fr }
    expect: { amenity: school, school:FR: collège, ref:UAI: 0690009J, ref:FR:SIRET: "19690009000012", website: "https://exemple.org", operator:type: public }
