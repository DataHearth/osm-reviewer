# Columns renamed to one input are read in the order listed, the first with a value winning: the
# older spellings come after the current ones.
rename:
  identifiant_de_l_etablissement: id
  nom_etablissement: name
  type_etablissement: kind
  statut_public_prive: status
  adresse_1: street
  adresse_2: address_line_2
  adresse_3: address_line_3
  code_postal: postcode
  nom_commune: city
  ecole_maternelle: has_maternelle
  ecole_elementaire: has_elementaire
  telephone: phone
  web: website
  site_web: website
  mail: email
  siren_siret: siret
  numero_siren_siret: siret
  latitude: lat
  longitude: lon
  date_ouverture: opening_date
  etat: state
  etat_etablissement: state
  code_nature: nature_code
  libelle_nature: nature_label
  type_rattachement_etablissement_mere: attachment_type
  etablissement_mere: parent_id
  precision_localisation: location_precision

