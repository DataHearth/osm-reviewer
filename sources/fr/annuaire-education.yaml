format: 1
source: fr/annuaire-education
mapping: FR:school
official:
  title: Annuaire de l'éducation
  publisher:
    name: Ministère de l'Éducation nationale
    relation: runs the public schools and supervises the private ones it lists
  licence: Licence Ouverte 2.0
  address: https://data.education.gouv.fr/explore/dataset/fr-en-annuaire-education/
  discussion:
    - https://forum.openstreetmap.fr/t/school-fr-et-osmose/12801
    - https://wiki.openstreetmap.org/wiki/France/data.gouv.fr/Établissements_scolaires
  source:
    kind: api
    endpoint: https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education/records
    schedule: weekly
    matching: amenity=school
    floor: 0.7
    allow:
      - amenity
      - name
      - operator:type
      - ref:UAI
      - ref:FR:SIRET
      - addr:*
      - phone
      - website
      - isced:level
      - school:FR
      - email
      - start_date
      - social_facility:for
