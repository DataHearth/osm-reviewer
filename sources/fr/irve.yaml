format: 1
source: fr/irve
mapping: FR:charging_station
official:
  title: "[BETA] Bases Nationales des Points de Recharge pour Véhicules Électriques en France (IRVE)"
  publisher:
    name: Point d'Accès National transport.data.gouv.fr
    relation: consolidates the files that operators of charging points must publish under the arrêté du 4 mai 2021, and replaces data.gouv.fr as the national registry
  licence: Licence Ouverte 2.0
  address: https://transport.data.gouv.fr/datasets/beta-bases-nationales-des-points-de-recharge-pour-vehicules-electriques-en-france-irve
  discussion:
    - https://wiki.openstreetmap.org/wiki/France/data.gouv.fr/Bornes_de_Recharge_pour_Véhicules_Électriques
    - https://forum.openstreetmap.fr/t/rdv-avec-le-pan-au-sujet-des-bornes-de-recharge-irve-en-septembre/36334
  source:
    kind: registry
    endpoint: https://www.data.gouv.fr/api/1/datasets/685965d0ab901919e14a4a1b/
    formerEndpoints:
      - https://www.data.gouv.fr/api/1/datasets/5448d3e0c751df01f85d0572/
      - https://www.data.gouv.fr/api/1/datasets/base-nationale-des-irve-data-gouv-infrastructures-de-recharge-pour-vehicules-electriques-donnees-statiques/
      - https://www.data.gouv.fr/api/1/datasets/base-nationale-des-irve-infrastructures-de-recharge-pour-vehicules-electriques/
      - https://www.data.gouv.fr/api/1/datasets/fichier-consolide-des-bornes-de-recharge-pour-vehicules-electriques/
    schedule: daily
    matching: amenity=charging_station
    floor: 0.7
    allow:
      - amenity
      - operator
      - network
      - capacity
      - ref:EU:EVSE
      - socket:*
      - fee
      - access
      - opening_hours
      - motorcycle
      - motorcar
      - authentication:none
      - payment:credit_cards
      - reservation
      - start_date
      - owner
      - operator:phone
      - wheelchair
      - maxheight
