# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image

# Every push to main publishes `edge`; a v*.*.* tag publishes the release tags and then
# the GitHub release. Cut a tag with `release app <version>`, which commits the changelog
# section the notes are made from. The chart releases on its own (release-chart.yml).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datahearth/osm-reviewer

jobs:
  # Its own job, holding nothing: the notes step installs the Claude CLI by piping an
  # unpinned script into bash, and here the worst it can reach is a read-only token and
  # the notes text — not the package-write or OIDC signing tokens below.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release notes
        id: notes
        uses: ./.github/actions/release-notes
        with:
          changelog: CHANGELOG.md
          version: ${{ env.version }}
          subject: osm-reviewer
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          footer: |

            ---
            Image: `ghcr.io/datahearth/osm-reviewer:${{ env.version }}` (Helm: `--set image.tag=${{ env.version }}`)
            Verify: `cosign verify ghcr.io/datahearth/osm-reviewer:${{ env.version }} --certificate-identity-regexp="https://github.com/datahearth/osm-reviewer/.github/workflows/image.yml@.*" --certificate-oidc-issuer=https://token.actions.githubusercontent.com`

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ steps.notes.outputs.file }}
          if-no-files-found: error

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OSM_REVIEWER_REV=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      # Gate here, not after `merge`: the step above pushes by digest only, so nothing is
      # pullable by tag yet. A failure (fail-fast cancels the sibling platform) leaves the
      # blobs unreferenced instead of shipping a vulnerable image someone has to yank.
      - name: Vulnerability scan with grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          fail-build: true
          only-fixed: true
          output-format: table
          output-file: grype-report.txt

      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-report-${{ matrix.arch }}
          path: grype-report.txt
          if-no-files-found: warn

      - name: Export digest
        run: |
          mkdir -p /tmp/osm-reviewer/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/osm-reviewer/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/osm-reviewer/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          echo "### Build (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Pushed by digest \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.grype.outcome }}" = "failure" ]; then
            echo "**Grype:** ❌ fixable high/critical vulnerabilities — image left untagged" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f grype-report.txt ]; then
            { echo; echo "<details><summary>Grype report</summary>"; echo; echo '```'; cat grype-report.txt; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.value }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/osm-reviewer/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}},value=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/osm-reviewer/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Resolve manifest digest
        id: digest
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "value=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Multi-arch manifest" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON" >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
          TAGS: ${{ needs.merge.outputs.tags }}
        run: echo "$TAGS" | xargs -I {} cosign sign --yes "{}@$DIGEST"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom.spdx.json

      - name: Attest SBOM to image
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # Last, so a release page only ever announces an image that is published and signed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notes, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "osm-reviewer ${GITHUB_REF_NAME}" \
            --notes-file "${{ runner.temp }}/notes/release-notes.md" \
            --verify-tag
