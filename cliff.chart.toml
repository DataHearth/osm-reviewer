# git-cliff configuration for the Helm chart changelog (chart/CHANGELOG.md).
# https://git-cliff.org/docs/configuration
#
# A file of its own rather than cliff.toml plus flags: the templates strip a different
# tag prefix, and commit_parsers differs, which git-cliff exposes neither as a flag nor
# as an env override (GIT_CLIFF__GIT__COMMIT_PARSERS rejects the array). The templates
# are duplicated from cliff.toml — keep them in sync.

[changelog]
header = """
# Changelog\n
All notable changes to the osm-reviewer Helm chart are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this chart adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="chart-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}\
          {%- if commit.scope %}{{ commit.scope }}: {% endif %}\
          {{- commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="chart-v") }}]: \
                https://github.com/datahearth/osm-reviewer/compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="chart-v") }}]: \
                https://github.com/datahearth/osm-reviewer/tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/datahearth/osm-reviewer/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
# The mirror of cliff.toml's pattern: without it, the app's v* tags would slice the
# chart's history into app releases.
tag_pattern = "^chart-v[0-9]+\\.[0-9]+\\.[0-9]+"
conventional_commits = true
filter_unconventional = false
# Where this diverges from cliff.toml: a chart release is often nothing but chore
# commits, and cliff.toml skips every chore — which here would leave a version heading
# with nothing under it. The invocation is path-filtered to chart/**, so any chore
# reaching this config touched the chart.
commit_parsers = [
    { message = "^\\s*$", skip = true },
    # The bump commit is what the tag points at, so it would otherwise list itself
    # inside its own section.
    { message = "^chore\\(chart\\): chart v[0-9]", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^revert", group = "Removed" },
    { message = "^chore\\(chart\\)", group = "Changed" },
    { message = "^chore\\(deps\\)", group = "Changed" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^.*", group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
