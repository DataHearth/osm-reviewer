# git-cliff configuration for the app changelog (CHANGELOG.md).
# https://git-cliff.org/docs/configuration
#
# The chart has its own changelog and config (cliff.chart.toml). The templates are
# duplicated between the two files — keep them in sync.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}\
          {%- if commit.scope %}{{ commit.scope }}: {% endif %}\
          {{- commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/datahearth/osm-reviewer/compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/datahearth/osm-reviewer/tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/datahearth/osm-reviewer/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Only app tags are releases here. Without this, git-cliff reads the chart's chart-v*
# tags as app releases too, and every app release cut after one covers only the
# commits since that chart tag.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
conventional_commits = true
filter_unconventional = false
# The only place release content is filtered: the GitHub release body is the rendered
# CHANGELOG.md section (.github/actions/release-notes).
commit_parsers = [
    # filter_unconventional = false sends anything unmatched to Changed, and an empty
    # message renders there as a bare "- ".
    { message = "^\\s*$", skip = true },
    # By scope as well as by path (`release` excludes chart/**): --exclude-path drops
    # a commit only when every file it touched is excluded, and a chart change often
    # edits a workflow or the flake too.
    { message = "^\\w+\\(chart\\)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^revert", group = "Removed" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^.*", group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
