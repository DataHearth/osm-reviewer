{{- if and (not .Values.admin.existingSecret) .Values.admin.email }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osm-reviewer.adminSecret" . }}
  labels:
    {{- include "osm-reviewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  SEED_ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  SEED_ADMIN_PASSWORD: {{ required "admin.password is required when admin.email is set" .Values.admin.password | quote }}
  {{- with .Values.admin.name }}
  SEED_ADMIN_NAME: {{ . | quote }}
  {{- end }}
{{- end }}
