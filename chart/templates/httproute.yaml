{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "osm-reviewer.fullname" . }}
  labels:
    {{- include "osm-reviewer.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs needs at least one Gateway" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames: [{{ include "osm-reviewer.host" . | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "osm-reviewer.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
