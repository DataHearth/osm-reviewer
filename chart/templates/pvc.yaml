{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "osm-reviewer.fullname" . }}
  labels:
    {{- include "osm-reviewer.labels" . | nindent 4 }}
  annotations:
    # The database is the whole state of the instance; `helm uninstall` must not take it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
