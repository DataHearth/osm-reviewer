apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osm-reviewer.fullname" . }}
  labels:
    {{- include "osm-reviewer.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume: one writer, and the old pod must release the
  # database before the new one opens it. Not a value, because no other number works.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "osm-reviewer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osm-reviewer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: osm-reviewer
          image: "{{ .Values.image.repository }}:{{ include "osm-reviewer.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ORIGIN
              value: {{ include "osm-reviewer.origin" . | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.admin.existingSecret .Values.admin.email .Values.ssoSecret }}
          envFrom:
            {{- if or .Values.admin.existingSecret .Values.admin.email }}
            - secretRef:
                name: {{ include "osm-reviewer.adminSecret" . }}
            {{- end }}
            {{- with .Values.ssoSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # /login is the one page that answers without a session.
          readinessProbe:
            httpGet:
              path: /login
              port: http
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # SQLite puts its temporary files here; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "osm-reviewer.fullname" .) }}
        - name: tmp
          emptyDir: {}
