image:
  repository: ghcr.io/datahearth/osm-reviewer
  # Required: the app release to run, e.g. 0.9.3.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Required. The address reviewers open, e.g. https://osm-review.example.net. adapter-node
# checks form posts against it, the session cookie is Secure only when it is https, and
# the Ingress and HTTPRoute take their hostname from it.
origin: ""

# The first admin, created at boot only while the users table is empty. Changing these
# later does nothing; change the password from the app's settings instead.
admin:
  email: ""
  password: ""
  name: ""
  # Use a Secret you manage instead, with keys SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD and
  # optionally SEED_ADMIN_NAME. The three values above are then ignored.
  existingSecret: ""

# Extra environment: adapter-node's BODY_SIZE_LIMIT, and the OpenID Connect sign-in, which
# stays off until SSO_ISSUER is set. SSO_PROVIDER, SSO_CLIENT_ID, SSO_SCOPES and SSO_GROUP
# are described in .env.example.
env: {}

# A Secret you manage with the key SSO_CLIENT_SECRET, for a confidential OIDC client. Leave
# empty for a public client, which PKCE alone protects.
ssoSecret: ""

persistence:
  size: 1Gi
  storageClass: ""
  # Mount a claim you manage instead of creating one.
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Secret holding the certificate for the origin's host; leave empty to serve without TLS.
  tlsSecretName: ""

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: gateway
  #   namespace: gateway-system
  #   sectionName: https

resources: {}
